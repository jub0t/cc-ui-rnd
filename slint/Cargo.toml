[package]
name = "wolfcut-ui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Skia is the rasterizer Chrome draws with, so matching it is what makes
# 400-weight text on a dark panel carry the same visual weight here as it does
# in web/. FemtoVG is dropped rather than merely supplemented: when both are
# compiled in, the winit backend picks FemtoVG first and Skia never runs.
slint = { version = "1.14", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-skia",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
] }

[build-dependencies]
slint-build = "1.14"

[profile.release]
opt-level = "s"
lto = true

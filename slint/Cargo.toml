[package]
name = "wolfcut-ui"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []

# Opt-in only: `cargo run --features skia`.
#
# Skia is not a GPU-vs-no-GPU choice — the default FemtoVG renderer is already
# GPU-accelerated via OpenGL. What Skia adds is text and path rasterization
# quality, and what it costs is a prebuilt C++ library, which is the one thing
# that makes cross-compiling to mac/linux/windows unpredictable: it drags in
# cc, bindgen and clang-sys, so every target needs a C++ toolchain and a
# matching sysroot rather than just `rustup target add`. It is also toolchain-
# coupled at link time — the prebuilt skia.lib wants MSVC 17.13+ and fails with
# an opaque LNK2019 on 17.12.
#
# So it stays a flag for A/B-ing fidelity on a dev box, never a release default.
# When the winit backend has both compiled in it picks Skia; force the other
# with SLINT_BACKEND=winit-femtovg.
skia = ["slint/renderer-skia"]

[dependencies]
slint = "1.14"

[build-dependencies]
slint-build = "1.14"

[profile.release]
opt-level = "s"
# "thin" rather than `true` (which is fat LTO). Fat LTO re-optimises the whole
# dependency graph in one serial link step — that is where the 13-minute
# release build went. Thin LTO keeps most of the win, runs in parallel across
# codegen units, and cuts the link to a fraction of it.
lto = "thin"

[package]
name = "wolfcut-ui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# FemtoVG over wgpu rather than over OpenGL. Same renderer, native graphics API
# underneath: Metal on macOS, D3D12 on Windows, Vulkan on Linux — instead of
# OpenGL, which Apple deprecated and now emulates on top of Metal anyway.
# Still pure Rust, so cross-compiling needs nothing beyond `rustup target add`.
# See the [features] block below for the Skia alternative under evaluation.
#
# default-features is off because `renderer-femtovg` (the OpenGL path) is a
# default. Enabling both compiles glutin and the whole GL renderer for nothing:
# i-slint-backend-winit picks wgpu over GL in default_renderer_factory, and
# cfg's the GL path out of the fallback list entirely. The rest of this list is
# slint's default set, reproduced verbatim minus that one renderer.
#
# 1.17, not 1.14: renderer-femtovg-wgpu does not exist in 1.14. Cargo.lock
# already resolved 1.17.1, so this only makes the requirement honest.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
    # The custom title bar: main.rs needs the winit window to hide the native
    # title bar (macOS traffic-light overlay) and to start window drags from
    # the strip's drag region.
    "unstable-winit-030",
] }

# The renderer is picked by a feature here rather than by editing the
# dependency, so both variants build from one tree and can be compared:
#
#   cargo build --release                                        # skia
#   cargo build --release --no-default-features --features wgpu   # femtovg/wgpu
#
# Skia is the default. It has partial rendering machinery that FemtoVG lacks
# entirely — but Surface's use_partial_rendering() defaults to false and is
# overridden only by software_surface.rs, so it is OFF on Metal/D3D/Vulkan/GL.
# Measure before believing any CPU or power claim about it; the reason it is
# the default here is that its text rendering is gamma-correct, not that it is
# known to be cheaper.
#
# Theme.weight-body/weight-title are 400/500 to match: the 500/600 they used to
# carry compensated for FemtoVG compositing glyph coverage without gamma
# correction. Put them back if you build --features wgpu, or the text will be
# too light there.
[features]
default = ["skia"]
wgpu = ["slint/renderer-femtovg-wgpu"]
skia = ["slint/renderer-skia"]

[build-dependencies]
slint-build = "1.17"

[profile.release]
# Every knob here is set for the fastest possible binary, and each one costs
# build time. Measured on an M5: clean build 74.5s -> 105.4s, binary 21.1MB
# -> 12.6MB. No runtime win was ever demonstrated; the UI is vsync-locked.
#
# Two more levers live outside this block, because they are not profile
# settings:
#
#   - `-C target-cpu=native`, in ../.cargo/config.toml. The one flag here that
#     can change generated code rather than just how hard it is optimised, and
#     the one that makes the binary local-only. See that file.
#   - `require_metal()` / `require_d3d()`, in main.rs. Not a speed-up: they
#     stop the renderer from *silently* falling back to Skia's CPU rasteriser,
#     which is the only performance cliff in this application big enough to
#     see, and the only one that can happen without anyone noticing.
#
# What is deliberately not done, so nobody goes looking for it twice:
#
#   - No alternative allocator. It is the usual next suggestion and it is a
#     dependency for a win nobody here has measured; the profile above was
#     written under the same rule.
#   - `renderer-software` stays in the feature list. It is dead weight on
#     macOS and Windows now that both require a GPU surface by name, and it is
#     the last resort on a Linux box without one. Removing it is a decision
#     about what to ship, not about how fast this runs.
#   - Skia's partial rendering is still off, and cannot be turned on from
#     here: `use_partial_rendering()` defaults to false and only
#     software_surface.rs overrides it, so every dirty property redraws the
#     whole window on every GPU surface. That is the shape of this
#     application's frame cost, and no flag in this file changes it.
opt-level = 3
# Fat LTO: re-optimise the whole dependency graph — slint, femtovg, winit and
# this crate — as one unit, so calls across crate boundaries inline. Thin LTO
# gets most of this in parallel; fat gets the rest in one serial link step.
lto = "fat"
# One codegen unit. Fat LTO already serialises the link, so the parallelism
# given up here is smaller than it looks, and it removes the last barrier to
# cross-function optimisation inside each crate.
codegen-units = 1
# No unwind tables and no landing pads: every call site loses its unwind edge,
# which frees the optimiser and shrinks the binary. This is a GUI binary with
# no tests and no catch_unwind, and unwinding through the ObjC frames of the
# macOS event loop was never well-defined anyway — winit only catches panics
# to avoid exactly that. `cargo test --release` cannot work under this.
panic = "abort"
# Symbols are worth nothing in a release binary that is not being profiled.
# Drop this line before running Instruments or perf against it.
strip = "symbols"

[profile.dev.package."*"]
# Dependencies at -O2, this crate at -O0. Slint's renderer is unusably slow
# when compiled unoptimised, but it is also compiled exactly once — while
# src/main.rs is what actually gets rebuilt, and stays fast to rebuild.
opt-level = 2

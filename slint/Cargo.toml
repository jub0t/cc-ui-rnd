[package]
name = "wolfcut-ui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Default features give the winit backend and the FemtoVG renderer, which is
# GPU-accelerated over OpenGL and pure Rust — so cross-compiling needs nothing
# beyond `rustup target add`. Slint's Skia renderer was evaluated and rejected;
# slint/README.md records why.
slint = "1.14"

[build-dependencies]
slint-build = "1.14"

[profile.release]
opt-level = "s"
# "thin" rather than `true` (which is fat LTO). Fat LTO re-optimises the whole
# dependency graph in one serial link step — that is where the 13-minute
# release build went. Thin LTO keeps most of the win, runs in parallel across
# codegen units, and cuts the link to a fraction of it.
lto = "thin"

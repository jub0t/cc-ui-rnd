[package]
name = "wolfcut-ui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# FemtoVG over wgpu rather than over OpenGL. Same renderer, native graphics API
# underneath: Metal on macOS, D3D12 on Windows, Vulkan on Linux — instead of
# OpenGL, which Apple deprecated and now emulates on top of Metal anyway.
# Still pure Rust, so cross-compiling needs nothing beyond `rustup target add`.
# Slint's Skia renderer was evaluated and rejected; slint/README.md records why.
#
# default-features is off because `renderer-femtovg` (the OpenGL path) is a
# default. Enabling both compiles glutin and the whole GL renderer for nothing:
# i-slint-backend-winit picks wgpu over GL in default_renderer_factory, and
# cfg's the GL path out of the fallback list entirely. The rest of this list is
# slint's default set, reproduced verbatim minus that one renderer.
#
# 1.17, not 1.14: renderer-femtovg-wgpu does not exist in 1.14. Cargo.lock
# already resolved 1.17.1, so this only makes the requirement honest.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg-wgpu",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
] }

[build-dependencies]
slint-build = "1.17"

[profile.release]
# Every knob here is set for the fastest possible binary, and each one costs
# build time. The measured cost on this machine is recorded in slint/README.md.
opt-level = 3
# Fat LTO: re-optimise the whole dependency graph — slint, femtovg, winit and
# this crate — as one unit, so calls across crate boundaries inline. Thin LTO
# gets most of this in parallel; fat gets the rest in one serial link step.
lto = "fat"
# One codegen unit. Fat LTO already serialises the link, so the parallelism
# given up here is smaller than it looks, and it removes the last barrier to
# cross-function optimisation inside each crate.
codegen-units = 1
# No unwind tables and no landing pads: every call site loses its unwind edge,
# which frees the optimiser and shrinks the binary. This is a GUI binary with
# no tests and no catch_unwind, and unwinding through the ObjC frames of the
# macOS event loop was never well-defined anyway — winit only catches panics
# to avoid exactly that. `cargo test --release` cannot work under this.
panic = "abort"
# Symbols are worth nothing in a release binary that is not being profiled.
# Drop this line before running Instruments or perf against it.
strip = "symbols"

[profile.dev.package."*"]
# Dependencies at -O2, this crate at -O0. Slint's renderer is unusably slow
# when compiled unoptimised, but it is also compiled exactly once — while
# src/main.rs is what actually gets rebuilt, and stays fast to rebuild.
opt-level = 2
